[project]
name = "pr-radar"
version = "0.1.0"
description = "Local god-view of the GitHub PRs you have a stake in"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pr-radar = "pr_radar.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
